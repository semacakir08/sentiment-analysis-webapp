<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Analysis Web App</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: auto; margin-top: 80px; }
        textarea { width: 100%; padding: 10px; margin-top: 10px; }
        button { margin-top: 15px; padding: 10px; width: 100%; background-color: #4CAF50; color: white; border: none; }
        .result { margin-top: 20px; font-size: 22px; }
    </style>
</head>
<body>

<h2>Sentiment Analysis</h2>

<form method="POST">
    <textarea name="comment" placeholder="Write your review here..." rows="4"></textarea>
    <button type="submit">Analyze</button>
</form>

{% if prediction %}
    <div class="result">
        Result: <strong>{{ prediction }}</strong>
    </div>
{% endif %}

</body>
</html>
